services:
  local-s3:
    image: ghcr.io/shyim/local-s3:latest
    ports:
      - "9000:9000"
    volumes:
      - osadle:/data
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - local-s3

volumes:
  osadle:
